
on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Which season are we inquiring about?'     
        required: true
        #default: 'warning' 
        type: choice
        options:
        - 'Spring'
        - 'Summer'
        - 'Fall'
      # tags:
      #   description: 'Test scenario tags'
      #   required: false 
      #   type: boolean
      # environment:
      #   description: 'Environment to run tests against'
      #   type: environment
      #   required: true
  #schedule:
    # end of Spring,Summer,Fall semester
  #  - cron: '0 0 30 5,8,12 *'
    # end of Spring semester
    #- cron: '0 0 30 5 *'
    # end of Summer semester
    #- cron: '0 0 30 8 *'
    # end of Fall semester
    #- cron: '0 0 30 12 *'
    # * is a special character in YAML so you have to quote this string
    #- cron:  '*/10 * * * *'

name: Send Data Email

jobs:
  build:
    name: Send Data Email
    runs-on: self-hosted
    steps:
      - name: Get current date and timestamp
        id: timestamp
        run: | 
          CURRENTMONTH=$(date +'%m')
          CURRENTYEAR=$(date +'%Y')
          LASTYEAR=$(date --date='-1 year' +'%Y')
          echo "::set-output name=datestamp::$(date +'%Y-%m-%d')"
          echo "::set-output name=currentmonth::$CURRENTMONTH"
          echo "::set-output name=currentyear::$(date +'%Y')"
          echo "::set-output name=lastyear::$(date --date='-1 year' +'%Y')"

          if [ "${{ github.event.inputs.season }}" = "Fall" ]; then
            if [ "$CURRENTMONTH" = "12" ]; then
              echo "::set-output name=calculatedyear::$CURRENTYEAR"
            else
              echo "::set-output name=calculatedyear::$LASTYEAR"
            fi
          else
            echo "::set-output name=calculatedyear::$CURRENTYEAR"
          fi
      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          # Required mail server address:
          server_address: smtp.gmail.com
          # Required mail server port:
          server_port: 465
          # Optional (recommended): mail server username:
          username: ${{secrets.MAIL_USERNAME}}
          # Optional (recommended) mail server password:
          password: ${{secrets.MAIL_PASSWORD}}
          # Required mail subject:
          subject: FOIA Request (${{ steps.timestamp.outputs.datestamp }})
          # Required recipients' addresses:
          to: austinjckson@gmail.com
          #to: publicinfo@uh.edu,austinjckson@gmail.com
          # Required sender full name (address can be skipped):
          from: Austin Jackson
          # Optional whether this connection use TLS (default is true if server_port is 465)
          secure: true
          # Optional plain body:
          html_body: |
            Hello my name is Austin Jackson,

            ${{secrets.MAIL_PERSONAL_INFO}}
            
            I am requesting the grade distributions by percent and/or letter grade, for every class and instructor for the ${{ github.event.inputs.season }} ${{ steps.timestamp.outputs.calculatedyear }} semester at the University of Houston. Please ensure the documents are FERPA compliant. I request that the information is in CSV format, and in digital format. Preferably in the form:

            Course Subject, Course Number, Course Title, Course Section, Term/Semester, Primary Instructor, A+, A, A-, B+, B, B-, C+, C, C-, D+, D, D-, F, W, Average Grade in GPA, S (Satisfactory), NCR (No Credit Reported).

            Please note, I have included the "S" and "NCR" fields as part of the [Spring 2020 Interim Grade Policy](https://web.archive.org/web/20210415040609/https://uh.edu/provost/policies-resources/student/interim-undergraduate-grade-policy/index). If including these fields is extra work or otherwise incompatible with your procedures, please do not include them as part of this request.

            In addition, if putting in that form is extra work, comma separated value format with the requisite information is acceptable.

            Please notify me of any expenses prior to incurring them.

            Thank you,
            
            Austin Jackson
          convert_markdown: true
