on: 
  workflow_dispatch:
    inputs:
      environment:
        description: "What environment are we deploying to? Enter: 'Production' or 'Preview'."
        required: true
        default: 'Production'

name: Deployment

jobs:
  deployment:
    name: Deployment
    runs-on: self-hosted
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ (github.event.inputs.environment == 'Production' && secrets.FIREBASE_PRODUCTION_SERVICE_ACCOUNT) || secrets.FIREBASE_PREVIEW_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install + Compile
        run: |
          npm install
          npm run build

      - name: Test Firebase access
        run: node build/testAccess.js

      - name: Download latest public data bundle
        run: node build/downloadBundle.js

      - name: Delete existing collections
        run: node build/deleteCollections.js

      - name: Upload records from CSV data
        run: node build/uploadRecords.js

      - name: Execute patchfiles
        run: node build/executePatchfiles.js
