on: 
  workflow_dispatch: ~

name: Deployment

jobs:
  deployment:
    name: Deployment
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Install + Compile
        run: |
          npm install
          npm run build
      - name: Test Firebase access
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_PRODUCTION_SERVICE_ACCOUNT }}
        run: node build/testAccess.js

      - name: Download latest public data bundle
        run: node build/downloadBundle.js

      - name: Delete existing collections
        run: node build/deleteCollections.js

